<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Knowledge products — UN OSAA Data Catalog</title>
    <meta name="description" content="UN OSAA reports with every data point they used — value, source attribution, dataset link and the figure it appeared in.">
    <meta name="theme-color" content="#1e3c72">

    <link rel="icon" type="image/svg+xml" href="OSAA identifier color.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="icons.js"></script>
    <script src="layout.js"></script>
</head>
<body data-page="reports">
    <div id="header-placeholder"></div>

    <main class="main-content" id="main">
        <div class="container">

            <div class="page-hero">
                <p class="page-hero__eyebrow">
                    <span class="icon" data-icon="file-lines"></span> Knowledge products
                </p>
                <h1>Reports and the data behind them</h1>
                <p>
                    Each report lists every data point it used — the figure quoted, who
                    published it, a link to the dataset, and where in the report it appeared.
                </p>
            </div>

            <div class="stat-grid">
                <div class="stat-card">
                    <span class="stat-card__icon" aria-hidden="true"><span class="icon" data-icon="file-lines"></span></span>
                    <div>
                        <div class="stat-card__value" id="statReports">—</div>
                        <div class="stat-card__label">Knowledge products</div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-card__icon" aria-hidden="true"><span class="icon" data-icon="chart-line"></span></span>
                    <div>
                        <div class="stat-card__value" id="statPoints">—</div>
                        <div class="stat-card__label">Data points recorded</div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-card__icon" aria-hidden="true"><span class="icon" data-icon="database"></span></span>
                    <div>
                        <div class="stat-card__value" id="statSources">—</div>
                        <div class="stat-card__label">Cited data sources</div>
                    </div>
                </div>
            </div>

            <div id="coverageNote"></div>

            <section class="toolbar" aria-label="Filter knowledge products">
                <div class="toolbar__grid">
                    <div class="field field--wide">
                        <label for="reportComboInput">Jump to a report</label>
                        <div class="combobox" id="reportCombo">
                            <input class="input" type="text" id="reportComboInput" autocomplete="off"
                                   role="combobox" aria-expanded="false" aria-autocomplete="list"
                                   aria-controls="reportComboList"
                                   placeholder="Start typing a report title or year…">
                            <button type="button" class="combobox__toggle" id="reportComboToggle"
                                    tabindex="-1" aria-label="Show all reports">
                                <span class="icon" data-icon="chevron-down"></span>
                            </button>
                            <ul class="combobox__list" id="reportComboList" role="listbox"
                                aria-label="Reports" hidden></ul>
                        </div>
                    </div>
                    <div class="field field--wide">
                        <label for="reportSearch">Search content</label>
                        <div class="search">
                            <span class="icon search__icon" data-icon="magnifying-glass"></span>
                            <input class="input" type="search" id="reportSearch" autocomplete="off"
                                   placeholder="Data point, figure, source or summary…">
                            <button type="button" class="search__clear" id="reportSearchClear"
                                    hidden aria-label="Clear search">
                                <span class="icon" data-icon="xmark"></span>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="reportClusterFilter">Cluster</label>
                        <select class="select" id="reportClusterFilter">
                            <option value="">All clusters</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="sourceFilter">Data source</label>
                        <select class="select" id="sourceFilter">
                            <option value="">All data sources</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="tagFilter">Tag</label>
                        <select class="select" id="tagFilter">
                            <option value="">All tags</option>
                        </select>
                    </div>
                </div>
            </section>

            <div class="result-bar">
                <p class="result-count" id="resultCount" role="status"></p>
                <div class="chip-row" id="activeFilters"></div>
                <div class="menu-wrap">
                    <button type="button" class="btn btn--secondary btn--sm" id="exportBtn"
                            aria-haspopup="true" aria-expanded="false">
                        <span class="icon" data-icon="download"></span>
                        Export
                    </button>
                    <ul class="menu" hidden>
                        <li><button type="button" data-format="csv">
                            <span class="icon" data-icon="report"></span>
                            <span>CSV<small>Spreadsheet of the data points shown</small></span>
                        </button></li>
                        <li><button type="button" data-format="json">
                            <span class="icon" data-icon="database"></span>
                            <span>JSON<small>Full records, as loaded</small></span>
                        </button></li>
                    </ul>
                </div>
            </div>

            <div class="card-list" id="reportsGrid"></div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="search.js"></script>
    <script src="export.js"></script>
    <script src="data-loader.js"></script>
    <script src="reports-page.js"></script>
</body>
</html>
